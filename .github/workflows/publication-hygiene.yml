name: Public Repo Hygiene (Advisory)
permissions:
  contents: read
on:
  pull_request:
  workflow_dispatch:

jobs:
  prepublication-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Test scanner patterns
        run: python scripts/check_publication_hygiene.py --self-test
      - name: Scan reachable repository blobs and report redacted results
        run: python scripts/check_publication_hygiene.py --history
