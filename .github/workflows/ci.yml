name: Synthetic Reference Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run deterministic tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Prove M1/M2 mutations are detected
        env:
          PYTHONPATH: src
        run: python scripts/verify_mutations.py
      - name: Run synthetic demo
        env:
          PYTHONPATH: src
        run: python -m workcoord_lab.demo
