name: Synthetic Reference Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run deterministic tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Prove M1/M2 mutations are detected
        env:
          PYTHONPATH: src
        run: python scripts/verify_mutations.py
      - name: Verify context-selector mutations are detected
        env:
          PYTHONPATH: src
        run: python scripts/verify_context_mutations.py
      - name: Run synthetic intelligence walkthrough
        env:
          PYTHONPATH: src
        run: python -m workcoord_lab.intelligence_demo
      - name: Verify retrieval-comparison regressions are detected
        env:
          PYTHONPATH: src
        run: python scripts/verify_comparison_mutations.py
      - name: Run three-arm context comparison (public synthetic fixture)
        env:
          PYTHONPATH: src
        run: python -m workcoord_lab.context_comparison --output artifacts/context-comparison-v0.json
      - name: Upload deterministic context evaluation receipt
        uses: actions/upload-artifact@v4
        with:
          name: context-eval-py-${{ matrix.python-version }}
          path: artifacts/context-comparison-v0.json
          if-no-files-found: error
      - name: Detect adaptive policy and evaluator regressions
        env:
          PYTHONPATH: src
        run: python scripts/verify_adaptive_mutations.py
      - name: Run adaptive evidence development evaluation
        env:
          PYTHONPATH: src
        run: python -m workcoord_lab.adaptive_eval --output artifacts/adaptive-eval-v0.json
      - name: Upload deterministic adaptive evaluation receipt
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-eval-py-${{ matrix.python-version }}
          path: artifacts/adaptive-eval-v0.json
          if-no-files-found: error
      - name: Detect research admission regressions (M17-M24)
        env:
          PYTHONPATH: src
        run: python scripts/verify_research_mutations.py
      - name: Run public research admission development cases
        env:
          PYTHONPATH: src
        run: python -m workcoord_lab.research_quality_suite --output artifacts/research-quality-v0.json
      - name: Upload deterministic research admission receipt
        uses: actions/upload-artifact@v4
        with:
          name: research-quality-py-${{ matrix.python-version }}
          path: artifacts/research-quality-v0.json
          if-no-files-found: error
      - name: Detect problem and decision admission regressions (M25-M39)
        env:
          PYTHONPATH: src
        run: python scripts/verify_problem_mutations.py
      - name: Evaluate public problem-decision development cases
        env:
          PYTHONPATH: src
        run: python -m workcoord_lab.problem_decision_suite --output artifacts/problem-decision-v0.json
      - name: Upload deterministic problem-decision receipt
        uses: actions/upload-artifact@v4
        with:
          name: problem-decision-py-${{ matrix.python-version }}
          path: artifacts/problem-decision-v0.json
          if-no-files-found: error
      - name: Detect cognitive perspective regressions (M40-M53)
        env:
          PYTHONPATH: src
        run: python scripts/verify_cognitive_mutations.py
      - name: Evaluate public cognitive perspective development cases
        env:
          PYTHONPATH: src
        run: python -m workcoord_lab.cognitive_perspectives_suite --output artifacts/cognitive-perspectives-v0.json
      - name: Upload deterministic cognitive perspective receipt
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-perspectives-py-${{ matrix.python-version }}
          path: artifacts/cognitive-perspectives-v0.json
          if-no-files-found: error
      - name: Verify knowledge genealogy regression mutations (M54-M70)
        env:
          PYTHONPATH: src
        run: python scripts/verify_genealogy_mutations.py
      - name: Evaluate public knowledge genealogy development cases
        env:
          PYTHONPATH: src
        run: python -m workcoord_lab.knowledge_genealogy_suite --output artifacts/knowledge-genealogy-v0.json
      - name: Upload deterministic knowledge genealogy receipt
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-genealogy-py-${{ matrix.python-version }}
          path: artifacts/knowledge-genealogy-v0.json
          if-no-files-found: error
      - name: Detect vertical evidence-chain regressions (M71-M88)
        env:
          PYTHONPATH: src
        run: python scripts/verify_vertical_mutations.py
      - name: Evaluate public four-stage vertical development cases
        env:
          PYTHONPATH: src
        run: python -m workcoord_lab.vertical_integration_suite --output artifacts/vertical-evidence-v0.json
      - name: Upload deterministic vertical evidence receipts
        uses: actions/upload-artifact@v4
        with:
          name: vertical-evidence-py-${{ matrix.python-version }}
          path: artifacts/vertical-evidence-v0.json
          if-no-files-found: error
      - name: Run synthetic demo
        env:
          PYTHONPATH: src
        run: python -m workcoord_lab.demo
